<style>

    --ground: #E6E4DF;
    --ground-ink: #3A332E;
    --bar: #F4F3EF;
    --bar-line: #D6D3CC;
    /* Folien (festes Markenbild, identisch in beiden Themes) */
    --ink: #181310;
    --yellow: #FDE400;
    --paper: #FFFFFF;
    --stone: #F3F2EE;
    --line: #E2DFD8;
    --muted: #6E655E;
    --blue: #3E4A98;
    --green: #6EB42E;
    --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141210;
      --ground-ink: #D9D4CC;
      --bar: #1E1B18;
      --bar-line: #34302B;
    }
  }
  :root[data-theme="dark"] {
    --ground: #141210;
    --ground-ink: #D9D4CC;
    --bar: #1E1B18;
    --bar-line: #34302B;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ground-ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Werkzeugleiste ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px max(16px, calc((100% - 1280px) / 2));
    background: var(--bar);
    border-bottom: 1px solid var(--bar-line);
  }
  .toolbar strong { font-weight: 800; letter-spacing: -0.01em; }
  .toolbar .meta { font: 400 12px/1.4 var(--mono); opacity: .75; }
  .toolbar .spacer { flex: 1; }
  .btn {
    font: 700 14px/1 var(--sans);
    background: var(--yellow); color: var(--ink);
    border: 0; border-radius: 6px; padding: 10px 14px; cursor: pointer;
  }
  .btn:hover { background: var(--ink); color: var(--yellow); }
  .btn:focus-visible, .slide:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  /* ---------- Übersicht ---------- */
  .deck {
    display: flex; flex-direction: column; align-items: center; gap: 28px;
    padding-inline: 16px; padding-block: 28px 64px;
    counter-reset: slide;
  }
  .slide-wrap {
    width: 100%; max-width: 1280px;
    container: slide / inline-size;
    counter-increment: slide;
  }
  .slide {
    position: relative; overflow: hidden;
    aspect-ratio: 16 / 9;
    background: var(--paper); color: var(--ink);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgb(24 19 16 / .08), 0 10px 30px rgb(24 19 16 / .10);
    font-size: 1.6cqi; line-height: 1.4;
  }
  .slide::after {
    content: counter(slide);
    position: absolute; right: 2.2cqi; bottom: 1.6cqi;
    font: 500 .9cqi/1 var(--mono); color: var(--muted);
  }
  .s-yellow { background: var(--yellow); }
  .s-yellow::after { color: var(--ink); }
  .s-dark { background: var(--ink); color: var(--paper); }
  .s-dark::after { color: #9C938B; }

  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .eyebrow {
    font: 500 1.05cqi/1.3 var(--mono);
    letter-spacing: .04em; color: var(--muted);
  }
  .eyebrow b { color: var(--ink); font-weight: 500; }
  .note { font: 400 .95cqi/1.4 var(--mono); color: var(--muted); }

  /* ---------- Titel & Ende ---------- */
  .s-title { display: grid; grid-template-columns: 1fr auto; align-content: space-between; padding: 5cqi 6cqi; }
  .s-title .logo { width: 12cqi; height: auto; grid-column: 2; grid-row: 1 / span 2; align-self: start; }
  .s-title h1 {
    font-weight: 800; letter-spacing: -0.04em; line-height: .88;
    font-size: 10.5cqi; margin-top: 1.5cqi;
  }
  .s-title h1 span { display: block; font-size: .52em; letter-spacing: -0.025em; line-height: 1; margin-top: 1.2cqi; }
  .s-title .eyebrow, .s-title .eyebrow b { color: var(--ink); }
  .s-title .roles { display: flex; gap: 1cqi; flex-wrap: wrap; grid-column: 1 / -1; align-self: end; }

  .s-section { display: flex; flex-direction: column; justify-content: flex-end; padding: 6cqi; gap: 1.6cqi; }
  .s-section .part { font: 500 1.3cqi/1 var(--mono); color: var(--yellow); letter-spacing: .08em; text-transform: uppercase; }
  .s-section h2 { font-size: 8cqi; font-weight: 800; letter-spacing: -0.035em; line-height: .95; color: var(--yellow); }
  .s-section p { font-size: 2.2cqi; color: #CFC8C0; max-width: 60cqi; }

  /* ---------- Funktionsfolie: Text links, Screenshot rechts ---------- */
  .s-feature { display: grid; grid-template-columns: 30cqi 1fr; }
  .s-feature .copy, .s-phones .copy {

  .intent { font-size: 2.15cqi; font-weight: 500; line-height: 1.25; }
  .intent mark {
    background: linear-gradient(transparent 55%, var(--yellow) 55%, var(--yellow) 92%, transparent 92%);

  .points { list-style: none; margin: 0; padding: 0; display: grid; gap: 1cqi; font-size: 1.5cqi; }
  .points li { padding-left: 1.6cqi; position: relative; }
  .points li::before {

  /* ---------- Textfolien ---------- */
  .s-text { padding: 5cqi 6cqi; display: flex; flex-direction: column; gap: 3cqi; }
  .s-text h2 { font-size: 4.4cqi; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }

  /* ---------- Modell-Diagramm ---------- */
  .model { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 2.4cqi; align-items: center; flex: 1; }

  .lists { display: grid; gap: .8cqi; margin-top: .4cqi; }

  .funcs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6cqi; flex: 1; align-content: start; }

  .phones { display: flex; gap: 3cqi; justify-content: center; align-items: center; padding-right: 3cqi; }

  /* ---------- Checkliste ---------- */
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(var(--rows, 3), auto); gap: 1.6cqi 4cqi; counter-reset: step; flex: 1; align-content: center; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 4.4cqi 1fr; gap: .2cqi 1.4cqi; align-items: start; }
  .steps li::before {
    content: counter(step); grid-row: span 2;
    width: 4.4cqi; height: 4.4cqi; border-radius: 50%;

  .steps b { font-size: 1.9cqi; line-height: 1.2; padding-top: .3cqi; }
  .steps span { font: 400 1.05cqi/1.4 var(--mono); color: var(--muted); }
  .steps .warn { color: var(--ink); background: var(--yellow); padding: 0 .3em; }

  .more { display: grid; grid-template-columns: repeat(auto-fit, minmax(22cqi, 1fr)); gap: 1.6cqi 3cqi; }
  .more div { border-top: .25cqi solid var(--ink); padding-top: 1.2cqi; display: grid; gap: .5cqi; }
  .more b { font-size: 2cqi; }
  .more span { font-size: 1.45cqi; color: var(--muted); }

  /* ---------- Schmale Bildschirme: Folien fließen statt skalieren ---------- */
  @container slide (max-width: 680px) {
    .slide { aspect-ratio: auto; font-size: 15px; border-radius: 8px; }
    .slide::after { font-size: 11px; right: 14px; bottom: 12px; }
    .s-feature, .s-phones { grid-template-columns: 1fr; }
    .s-feature .copy, .s-phones .copy, .s-text, .s-section, .s-title { padding: 24px 20px 36px; gap: 14px; }
    .s-feature h2, .s-phones h2, .s-text h2 { font-size: 26px; }
    .intent { font-size: 18px; }
    .points { font-size: 15px; gap: 8px; }
    .points li { padding-left: 14px; }
    .points li::before { width: 6px; height: 6px; }
    .eyebrow, .note, .roles-row .lbl { font-size: 11px; }
    .chip { font-size: 12px; padding: 5px 9px; }
    .shot { margin: 0 16px 36px; border-radius: 6px; }
    .shot .urlbar { font-size: 10px; padding: 6px 10px; }
    .demo { position: static; padding: 0 20px 28px; font-size: 10px; }
    .s-title h1 { font-size: 48px; }
    .s-title .logo { width: 64px; }
    .s-title .roles span { font-size: 13px; padding: 7px 12px; }
    .s-title .url { font-size: 11px; }
    .s-section h2 { font-size: 40px; }
    .s-section .part { font-size: 11px; }
    .s-section p { font-size: 16px; }
    .before-after, .gains, .cases, .funcs, .steps, .model-wrap, .pair { grid-template-columns: 1fr; }
    .steps { grid-auto-flow: row; grid-template-rows: none; }
    .arrow { transform: rotate(90deg); font-size: 22px; }
    .link i { width: 2px; height: 28px; }
    .before p, .after p, .gain p, .box p, .func p, .case span, .more span, .aside, .foot { font-size: 14px; }
    .after .big { font-size: 34px; }
    .gain h3, .box h3 { font-size: 20px; }
    .list b, .case b, .steps b, .more b { font-size: 15px; }
    .list span, .steps span, .more .eyebrow { font-size: 11px; }
    .func .chip { font-size: 12px; }
    .steps li { grid-template-columns: 32px 1fr; }
    .steps li::before { width: 32px; height: 32px; font-size: 15px; }
    .phones { padding: 0 16px 40px; }
    .phone { width: 42%; border-radius: 18px; padding: 5px; }
    .phone img { border-radius: 14px; }
    .before, .box, .func, .case, .list { padding: 14px; }
  }

  /* ---------- Präsentationsmodus ---------- */
  body.present { overflow: hidden; background: #000; }
  body.present .toolbar { display: none; }
  body.present .deck { padding: 0; gap: 0; }
  body.present .slide-wrap { display: none; }
  body.present .slide-wrap.current {
    display: block; position: fixed; inset: 0; margin: auto;
    width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
    max-width: none;
  }
  body.present .slide { border-radius: 0; box-shadow: none; height: 100%; aspect-ratio: auto; cursor: pointer; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 400 12px/1 var(--mono); color: #bbb; background: rgb(0 0 0 / .6);
    padding: 7px 10px; border-radius: 6px; pointer-events: none;
    opacity: 0; transition: opacity .4s;
  }
  body.present .hint.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }

  @media print {
    @page { size: 13.333in 7.5in; margin: 0; }
    body { background: #fff; }
    .toolbar, .hint { display: none; }
    .deck { padding: 0; gap: 0; }
    .slide-wrap { max-width: none; break-after: page; }
    .slide { border-radius: 0; box-shadow: none; }
  }
</style>

<header class="toolbar">
  <strong>TeamWERK · Funktionärsschulung</strong>
  <span class="meta" id="count"></span>
  <span class="spacer"></span>
  <span class="meta">Pfeiltasten · Esc beendet</span>
  <button class="btn" id="present" type="button">Präsentieren</button>
</header>

<main class="deck" id="deck">
<!-- FOLIEN -->
</main>
<div class="hint" id="hint">← → blättern · Esc beendet</div>

<script>
  const wraps = [...document.querySelectorAll('.slide-wrap')];
  const body = document.body;
  const count = document.getElementById('count');
  const hint = document.getElementById('hint');
  let cur = 0;
  count.textContent = wraps.length + ' Folien';
  wraps.forEach(w => { const s = w.querySelector('.slide'); s.tabIndex = -1; });

  function show(i) {
    cur = Math.max(0, Math.min(wraps.length - 1, i));
    wraps.forEach((w, j) => w.classList.toggle('current', j === cur));
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  }
  function mostVisible() {
    let best = 0, bestVis = -1;
    wraps.forEach((w, i) => {
      const r = w.getBoundingClientRect();
      const vis = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
      if (vis > bestVis) { bestVis = vis; best = i; }
    });
    return best;
  }
  function enter() {
    show(mostVisible());
    body.classList.add('present');
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 2500);
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  }
  function leave() {
    body.classList.remove('present');
    try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
    wraps[cur].scrollIntoView({ block: 'center' });
  }
  document.getElementById('present').addEventListener('click', enter);
  document.addEventListener('keydown', e => {
    if (!body.classList.contains('present')) {
      if (e.key === 'p' || e.key === 'F5') { e.preventDefault(); enter(); }
      return;
    }
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(wraps.length - 1);
    else if (e.key === 'Escape') leave();
  });
  document.getElementById('deck').addEventListener('click', e => {
    if (!body.classList.contains('present')) return;
    show(e.clientX > innerWidth / 2 ? cur + 1 : cur - 1);
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && body.classList.contains('present')) leave();
  });
  const start = parseInt(location.hash.slice(1), 10);
  if (start > 1 && start <= wraps.length) wraps[start - 1].scrollIntoView({ block: 'start' });
</script>
