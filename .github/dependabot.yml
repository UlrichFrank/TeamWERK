# Wöchentliche Dependency-Updates:
#   - Patch + Minor pro Ecosystem in einem PR gebündelt.
#   - Major-Updates bleiben separat, damit Breaking Changes sichtbar sind.
# Die PRs durchlaufen den ci.yml-Gate (go vet/test, golangci-lint,
# pnpm build/test/lint) automatisch.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Tailwind v4 ist eine UI-weite Migration, kein Dependency-Bump:
      # CSS-first-Konfiguration statt tailwind.config.js, @import statt
      # @tailwind-Direktiven, @tailwindcss/postcss statt tailwindcss+
      # autoprefixer, umbenannte Utilities (shadow-sm→shadow-xs, andere
      # Ring-Breiten und Border-Default-Farbe) quer durch die verbindlichen
      # Klassen-Strings. Der Stack ist bewusst auf v3 festgelegt
      # (docs/agent/05-frontend.md); der Major-PR kam sonst wöchentlich wieder
      # (#171, geschlossen). Minor/Patch innerhalb v3 laufen weiter.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
