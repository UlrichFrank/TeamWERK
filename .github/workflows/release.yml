# Bei jedem Push auf main: nächste Semver-Version aus Conventional Commits
# ableiten, Tag erstellen + pushen, GitHub-Release mit Changelog anlegen.
#
# Deploy ist bewusst NICHT automatisch: ein von github-actions[bot] gepushtes
# Tag triggert deploy.yml's `push: tags:`-Trigger nicht (GitHub verhindert
# rekursive Workflow-Ketten aus dem Standard-GITHUB_TOKEN heraus) — und ein
# Prod-Deploy soll laut docs/agent/08-verification.md ohnehin ein bewusster,
# bestätigter Schritt sein, kein Nebeneffekt jedes main-Pushs. Wer taggen UND
# in einem Zug deployen will, löst das manuell per workflow_dispatch mit
# `deploy: true` aus (ruft deploy.yml als reusable Workflow auf).
#
# Push- und Dispatch-Trigger unterscheiden sich in genau einem Punkt: fällt kein
# release-relevanter Commit an, überspringt der Push-Lauf das Tag (Rauschen
# vermeiden), während der manuelle Lauf trotzdem eins erzeugt (Mindest-Bump aus
# `bump`, Default patch). Sonst wäre „manuell taggen + deployen" genau dann
# blockiert, wenn man es braucht — etwa nach einem Squash-Merge, dessen Titel
# der Branch-Name ist („Feat/event log (#193)") und den die Conventional-
# Commits-Analyse folgerichtig nicht als feat erkennt.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Mindest-Bump, wenn die Commits keinen größeren hergeben'
        required: false
        type: choice
        options: [patch, minor, major]
        default: patch
      force_version:
        description: 'Tag hart setzen (z. B. v1.2.3). Leer = aus Commits ableiten.'
        required: false
        default: ''
      deploy:
        description: 'Nach dem Taggen sofort auf Prod deployen'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      created: ${{ steps.next.outputs.created }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Nächste Version ermitteln
        id: next
        env:
          FORCE: ${{ inputs.force_version }}
          MIN_BUMP: ${{ inputs.bump }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          chmod +x scripts/next-version.sh
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -n "$FORCE" ]; then
            if ! printf '%s' "$FORCE" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::force_version='$FORCE' ist kein gültiges vMAJOR.MINOR.PATCH"
              exit 1
            fi
            NEXT="$FORCE"
          elif [ "$MANUAL" = "true" ]; then
            # Manueller Lauf: immer ein Tag. Die Commit-Analyse entscheidet über
            # die Höhe des Bumps, `bump` ist nur die Untergrenze — ein `feat:`
            # ergibt also minor, auch wenn hier patch steht.
            NEXT=$(scripts/next-version.sh --min "${MIN_BUMP:-patch}")
          else
            NEXT=$(scripts/next-version.sh)
          fi
          echo "Letztes Tag : ${LAST:-<keins>}"
          echo "Nächstes Tag: $NEXT"
          # Nur ohne force_version ist "NEXT == LAST" der Leerlauf-Fall; mit
          # force_version ist es ein Tippfehler und läuft unten in den Fehler.
          if [ -z "$FORCE" ] && [ -n "$LAST" ] && [ "$NEXT" = "$LAST" ]; then
            echo "Keine release-relevanten Commits (feat/fix/perf/!:) seit $LAST — übersprungen."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # force_version könnte auf ein schon vergebenes Tag zeigen; `git tag -a`
          # liefe darauf in einen nichtssagenden Fehler mitten im Lauf.
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "::error::Tag $NEXT existiert bereits (zeigt auf $(git rev-list -n1 "$NEXT"))"
            exit 1
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Changelog generieren
        if: steps.next.outputs.created == 'true'
        id: changelog
        env:
          VERSION: ${{ steps.next.outputs.version }}
          LAST: ${{ steps.next.outputs.last }}
        run: |
          set -euo pipefail
          if [ -z "$LAST" ]; then RANGE="HEAD"; else RANGE="${LAST}..HEAD"; fi
          {
            echo "## Änderungen seit ${LAST:-Beginn}"
            echo
            git log "$RANGE" --no-merges --pretty=format:'- %s' \
              | grep -E '^- (feat|fix|perf|refactor)(\([^)]+\))?!?:' || echo "- (keine release-relevanten Commits)"
          } > /tmp/CHANGELOG.md
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat /tmp/CHANGELOG.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tag erstellen + pushen
        if: steps.next.outputs.created == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: GitHub-Release anlegen
        if: steps.next.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: gh release create "$VERSION" --title "$VERSION" --notes "$BODY"

  deploy:
    needs: tag
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.tag.outputs.version }}
    secrets: inherit
