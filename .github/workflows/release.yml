# Bei jedem Push auf main: nächste Semver-Version aus Conventional Commits
# ableiten, Tag erstellen + pushen, GitHub-Release mit Changelog anlegen.
#
# Deploy ist bewusst NICHT automatisch: ein von github-actions[bot] gepushtes
# Tag triggert deploy.yml's `push: tags:`-Trigger nicht (GitHub verhindert
# rekursive Workflow-Ketten aus dem Standard-GITHUB_TOKEN heraus) — und ein
# Prod-Deploy soll laut docs/agent/08-verification.md ohnehin ein bewusster,
# bestätigter Schritt sein, kein Nebeneffekt jedes main-Pushs. Wer taggen UND
# in einem Zug deployen will, löst das manuell per workflow_dispatch mit
# `deploy: true` aus (ruft deploy.yml als reusable Workflow auf).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Tag manuell setzen (z. B. v1.2.3). Leer = automatisch aus Commits.'
        required: false
        default: ''
      deploy:
        description: 'Nach dem Taggen sofort auf Prod deployen'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      created: ${{ steps.next.outputs.created }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Nächste Version ermitteln
        id: next
        env:
          FORCE: ${{ inputs.force_version }}
        run: |
          set -euo pipefail
          chmod +x scripts/next-version.sh
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -n "$FORCE" ]; then
            if ! printf '%s' "$FORCE" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::force_version='$FORCE' ist kein gültiges vMAJOR.MINOR.PATCH"
              exit 1
            fi
            NEXT="$FORCE"
          else
            NEXT=$(scripts/next-version.sh)
          fi
          echo "Letztes Tag : ${LAST:-<keins>}"
          echo "Nächstes Tag: $NEXT"
          if [ -n "$LAST" ] && [ "$NEXT" = "$LAST" ]; then
            echo "Keine release-relevanten Commits (feat/fix/perf/!:) seit $LAST — übersprungen."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Changelog generieren
        if: steps.next.outputs.created == 'true'
        id: changelog
        env:
          VERSION: ${{ steps.next.outputs.version }}
          LAST: ${{ steps.next.outputs.last }}
        run: |
          set -euo pipefail
          if [ -z "$LAST" ]; then RANGE="HEAD"; else RANGE="${LAST}..HEAD"; fi
          {
            echo "## Änderungen seit ${LAST:-Beginn}"
            echo
            git log "$RANGE" --no-merges --pretty=format:'- %s' \
              | grep -E '^- (feat|fix|perf|refactor)(\([^)]+\))?!?:' || echo "- (keine release-relevanten Commits)"
          } > /tmp/CHANGELOG.md
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat /tmp/CHANGELOG.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tag erstellen + pushen
        if: steps.next.outputs.created == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: GitHub-Release anlegen
        if: steps.next.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: gh release create "$VERSION" --title "$VERSION" --notes "$BODY"

  deploy:
    needs: tag
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.tag.outputs.version }}
    secrets: inherit
