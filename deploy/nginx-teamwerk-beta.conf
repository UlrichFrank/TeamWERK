# Beta-Instanz (Vorschau neuer Oberflächen). Liegt auf dem VPS unter
# /etc/nginx/sites-available/teamwerk-beta (Symlink in sites-enabled/), wird von
# deploy/setup-beta.sh installiert. Der Prod-Block (sites-available/teamwerk)
# bleibt unberührt.
#
# Eigene Rate-Limit-Zone: Logins auf der Beta zählen nicht gegen das Limit von
# Prod. Site-Dateien werden im http{}-Kontext eingebunden, daher ist die
# Direktive hier zulässig.
limit_req_zone $binary_remote_addr zone=teamwerk_beta_auth:1m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name beta.teamwerk.team-stuttgart.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beta.teamwerk.team-stuttgart.org;

    ssl_certificate     /etc/letsencrypt/live/beta.teamwerk.team-stuttgart.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.teamwerk.team-stuttgart.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types application/json text/css text/javascript;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Vorschau-Instanz: nicht in Suchmaschinen.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.team-stuttgart.org https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://matomo.team-stuttgart.org; media-src 'self' blob:; connect-src 'self' https://matomo.team-stuttgart.org; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    client_max_body_size 50m;

    location /api/videos/upload/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $server_name;
        client_max_body_size    2700m;
        proxy_request_buffering off;
        proxy_http_version      1.1;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }

    location ~ ^/api/videos/[0-9]+/hls/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $server_name;
        proxy_buffering    off;
        proxy_http_version 1.1;
    }

    location ~ ^/api/auth/(login|refresh|forgot-password|reset-password)$ {
        limit_req          zone=teamwerk_beta_auth burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $server_name;
    }

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $server_name;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
